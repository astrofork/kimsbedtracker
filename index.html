<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ── Viewport: portrait + safe areas for notches/home-bars ─────────────── -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- ── PWA manifest ──────────────────────────────────────────────────────── -->
  <link rel="manifest" href="/manifest.json" />

  <!-- ── Theme colour — matches topbar bg; JS keeps it in sync per-theme ─────
       Light (default): white topbar → white status bar
       Dark: #0b0f14 · Purple: #F8F4FF · Teal: #F0FAFB                        -->
  <meta name="theme-color" content="#FFFFFF" />

  <!-- ── Apple / iOS PWA support ───────────────────────────────────────────── -->
  <meta name="apple-mobile-web-app-capable"          content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title"            content="BedFlow" />
  <link rel="apple-touch-icon"                       href="/icons/icon-192.png" />
  <!-- Splash screen background matches manifest background_color -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- ── Microsoft Tiles ───────────────────────────────────────────────────── -->
  <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
  <meta name="msapplication-TileColor" content="#0EA5E9" />

  <!-- ── SEO / sharing ─────────────────────────────────────────────────────── -->
  <meta name="description" content="Live hospital bed tracking for KIMS Hospitals Seethammadhara" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />

  <title>BedFlow — Smart Bed Management</title>

  <!-- ── Fonts ─────────────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- ── Safe-area CSS env vars for notched devices ────────────────────────── -->
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
      --sar: env(safe-area-inset-right);
    }
    html { background: #F8FAFC; }   /* prevents white flash on load */
    body { padding-bottom: var(--sab); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
