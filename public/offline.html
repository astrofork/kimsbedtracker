<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BedFlow — Offline</title>
  <style>
    :root { --teal: #0EA5E9; --bg: #F0F4F8; --ink: #0F172A; --ink-3: #94A3B8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 28px; box-shadow: 0 4px 20px rgba(14,165,233,.2); }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p  { font-size: 14px; color: var(--ink-3); line-height: 1.65; max-width: 300px; margin-bottom: 28px; }
    button {
      background: var(--teal); color: #fff; border: none;
      padding: 13px 28px; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      box-shadow: 0 2px 10px rgba(14,165,233,.35);
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="BedFlow logo" />
  <h1>You're offline</h1>
  <p>BedFlow needs a connection to show live bed data. Check your network and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
